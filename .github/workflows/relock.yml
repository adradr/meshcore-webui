name: relock
# One-shot helper: regenerate frontend/pnpm-lock.yaml for the react-dom bump
# using a runner that has npm registry access, then commit it back to the
# branch. Removed once the lockfile is reconciled.
on:
  push:
    branches: [claude/dependabot-prs-consolidate-eJp7s]

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          ref: claude/dependabot-prs-consolidate-eJp7s
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093  # v6.0.8
        with:
          version: 10
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 22
      - name: Bump react-dom to match react
        run: |
          sed -i 's/"react-dom": "\^19.2.6"/"react-dom": "^19.2.7"/' package.json
          grep '"react-dom"' package.json
        working-directory: frontend
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile --ignore-scripts
        working-directory: frontend
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(deps): bump react-dom to 19.2.7 and regenerate lockfile"
            git push origin HEAD:claude/dependabot-prs-consolidate-eJp7s
          fi
        working-directory: frontend
