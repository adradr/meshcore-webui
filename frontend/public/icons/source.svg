<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- background: rounded square so iOS doesn't double-clip -->
  <rect width="512" height="512" rx="115" fill="#0a0a0a"/>
  <!-- mesh network: 5 nodes (center + 4 around) connected with lines -->
  <g stroke="#0891b2" stroke-width="14" stroke-linecap="round">
    <!-- center to each outer node -->
    <line x1="256" y1="256" x2="140" y2="160"/>
    <line x1="256" y1="256" x2="372" y2="160"/>
    <line x1="256" y1="256" x2="140" y2="352"/>
    <line x1="256" y1="256" x2="372" y2="352"/>
    <!-- perimeter edges -->
    <line x1="140" y1="160" x2="372" y2="160" opacity="0.45"/>
    <line x1="140" y1="160" x2="140" y2="352" opacity="0.45"/>
    <line x1="372" y1="160" x2="372" y2="352" opacity="0.45"/>
    <line x1="140" y1="352" x2="372" y2="352" opacity="0.45"/>
  </g>
  <g fill="#0891b2" stroke="#ffffff" stroke-width="6">
    <circle cx="140" cy="160" r="32"/>
    <circle cx="372" cy="160" r="32"/>
    <circle cx="140" cy="352" r="32"/>
    <circle cx="372" cy="352" r="32"/>
  </g>
  <!-- center node larger (your device) -->
  <circle cx="256" cy="256" r="46" fill="#ffffff"/>
  <circle cx="256" cy="256" r="34" fill="#0891b2"/>
</svg>
