services:
  meshcore-webui:
    image: meshcore-webui:dev  # locally built; for prod use ghcr.io/<user>/meshcore-webui:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Default is the LilyGo T3-S3 WiFi-firmware default AP address.
      # Set to your device's actual LAN IP.
      MESHCORE_HOST: 192.168.4.1
      MESHCORE_PORT: "5000"
      VAPID_SUBJECT: mailto:you@example.com
      # REQUIRED if exposing this service to anything beyond a trusted LAN.
      # When unset, every /api/* endpoint is open to anyone who can reach the
      # port — including the destructive admin reset and factory-wipe routes.
      # Generate a long random secret: `openssl rand -hex 32`
      # Note: do NOT set this to an empty string — the backend rejects empty
      # values at startup. Either set a real secret, or leave the line absent.
      MESHCORE_WEBUI_API_KEY: "REPLACE_ME_WITH_openssl_rand_hex_32"
    volumes:
      - ./data:/data
      - ./secrets/vapid_private.pem:/run/secrets/vapid_private.pem:ro
