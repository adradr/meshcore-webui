services:
  meshcore-webui:
    image: meshcore-webui:dev  # locally built; for prod use ghcr.io/<user>/meshcore-webui:latest
    restart: unless-stopped
    # Defence-in-depth runtime caps. Combined with the non-root `USER` in the
    # Dockerfile these shrink the blast radius of a compromised process:
    #   - mem/cpu/pids: bound resource exhaustion (DoS, fork-bomb).
    #   - no-new-privileges: refuse setuid escalation inside the container.
    #   - cap_drop ALL: the app needs no Linux capabilities (it binds an
    #     unprivileged port and never raises privileges).
    #   - read_only + tmpfs /tmp: writable state is restricted to the
    #     bind-mounted /data volume (SQLite + attachments) and an in-memory
    #     /tmp for transient files (e.g. tempfile.NamedTemporaryFile).
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    ports:
      # Loopback-only by default. Change to "8080:8080" (or "0.0.0.0:8080:8080")
      # for direct LAN access without a reverse proxy.
      - "127.0.0.1:8080:8080"
    environment:
      # Default is the LilyGo T3-S3 WiFi-firmware default AP address.
      # Set to your device's actual LAN IP.
      MESHCORE_HOST: 192.168.4.1
      MESHCORE_PORT: "5000"
      VAPID_SUBJECT: mailto:you@example.com
      # REQUIRED if exposing this service to anything beyond a trusted LAN.
      # When unset, every /api/* endpoint is open to anyone who can reach the
      # port — including the destructive admin reset and factory-wipe routes.
      # Generate a long random secret: `openssl rand -hex 32`
      # Note: do NOT set this to an empty string — the backend rejects empty
      # values at startup. Either set a real secret, or leave the line absent.
      MESHCORE_WEBUI_API_KEY: "REPLACE_ME_WITH_openssl_rand_hex_32"
    volumes:
      - ./data:/data
      - ./secrets/vapid_private.pem:/run/secrets/vapid_private.pem:ro
