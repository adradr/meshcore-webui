[project]
name = "meshcore-webui-backend"
version = "0.1.0"
description = "Self-hosted MeshCore web client backend (FastAPI + meshcore + Web Push)"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.118",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.38",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "pywebpush>=2.3.0",
  "cryptography>=42",
  "meshcore>=2.3.7",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "Pillow>=12.2,<13",
  "starlette>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "freezegun>=1.5",
  "pip-audit>=2.7",
]

[tool.uv]
# Security floor for a transitive dependency. aiohttp arrives via
# pywebpush; 3.13.5 carries CVE-2026-34993 and CVE-2026-47265, both fixed
# in 3.14.0. A constraint (not a direct dependency) keeps the resolver from
# selecting an affected version without claiming we import it ourselves.
constraint-dependencies = ["aiohttp>=3.14.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Explicit package discovery: setuptools auto-discovery sees both `app/` and
# `tests/` at the project root and refuses to guess — say it loud.
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*", "secrets*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
