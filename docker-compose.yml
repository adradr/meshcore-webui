services:
  meshcore-webui:
    image: ghcr.io/adradr/meshcore-webui:latest
    # `docker compose pull` fetches the CI-built image from GHCR. The `build:`
    # block below is retained so `docker compose build` still works for local
    # development (it tags the same image name and overrides the pulled one).
    build:
      context: .
      args:
        VITE_VAPID_PUBLIC_KEY: "${VITE_VAPID_PUBLIC_KEY:-}"
    container_name: meshcore-webui
    restart: unless-stopped
    ports:
      - "8090:8080"   # host 8080 is taken by kubectl; using 8090
    environment:
      # Point at your MeshCore device's TCP companion port.
      # `192.168.4.1:5000` is the default for the LilyGo T3-S3 WiFi firmware.
      MESHCORE_HOST: "${MESHCORE_HOST:-192.168.4.1}"
      MESHCORE_PORT: "${MESHCORE_PORT:-5000}"
      VAPID_SUBJECT: mailto:adr@example.com
      # Read from .env (gitignored). To run without auth, remove this line or
      # leave MESHCORE_WEBUI_API_KEY empty in .env.
      MESHCORE_WEBUI_API_KEY: "${MESHCORE_WEBUI_API_KEY:-}"
    volumes:
      - ./data:/data
      - ./backend/secrets/vapid_private.pem:/run/secrets/vapid_private.pem:ro
